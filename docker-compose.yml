services:
  db:
    image: postgres:16-alpine
    container_name: spend-insights-db
    environment:
      POSTGRES_DB: spend_insights
      POSTGRES_USER: spend
      POSTGRES_PASSWORD: spend_secret
    ports:
      - "5432:5432"
    volumes:
      - spend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend -d spend_insights"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: spend-insights-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/spend_insights
      SPRING_DATASOURCE_USERNAME: spend
      SPRING_DATASOURCE_PASSWORD: spend_secret
      JWT_SECRET: local-dev-jwt-secret-change-me-32bytes-min-length!!
      JWT_EXPIRATION_MS: "86400000"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: spend-insights-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  spend_pg_data:
